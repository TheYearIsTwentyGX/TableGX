library:
  name: 'tablegx'
  version: '1.0.0'
  repository: ''
  description: 'High-performance, type-safe, animated React table system'
  primary_framework: 'React'

domains:
  - name: 'Table Layout and Core Setup'
    slug: 'core-setup'
    description: 'Initializing the ReadOnly, Editable, or Tabbed tables with columns and data'
  - name: 'Cell Interactivity'
    slug: 'cell-interactivity'
    description: 'Configuring inline edits and action buttons within cells'
  - name: 'Theming and Aesthetics'
    slug: 'theming'
    description: 'Overriding CSS classes and handling glassmorphism'

skills:
  - name: 'Initialize TabbedTable'
    slug: 'init-tabbed-table'
    domain: 'core-setup'
    description: 'Set up a TabbedTable with shared row selections and filters'
    type: 'core'
    covers: ['TabbedTable', 'ColumnDef']
    tasks: ['Create basic table', 'Configure frozen columns', 'Pass data']
    failure_modes:
      - mistake: 'Using raw HTML table'
        mechanism: 'Agents hallucinate `<table>` tags instead of using `TabbedTable`.'
        wrong_pattern: |
          <table><thead><tr>...</tr></thead></table>
        correct_pattern: |
          <TabbedTable data={data} tabs={tabs} idColumn="id" getRowId={row => row.id} />
        source: 'maintainer interview'
        priority: 'CRITICAL'
        status: 'active'
        version_context: 'Always applies'
        skills: ['init-tabbed-table']
  
  - name: 'Configure Action Columns'
    slug: 'config-action-columns'
    domain: 'cell-interactivity'
    description: 'Add interactive buttons to cells using column meta'
    type: 'core'
    covers: ['meta.actions', 'meta.fixedMeasureWidth']
    tasks: ['Add view/edit/delete buttons']
    failure_modes:
      - mistake: 'Omitting fixedMeasureWidth'
        mechanism: 'Without fixedMeasureWidth, the action column collapses because icons have no text width.'
        wrong_pattern: |
          { id: 'actions', meta: { actions: [{ icon: <Eye />, onClick: () => {} }] } }
        correct_pattern: |
          { id: 'actions', meta: { fixedMeasureWidth: 100, actions: [{ icon: <Eye />, onClick: () => {} }] } }
        source: 'maintainer interview'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Always applies'
        skills: ['config-action-columns']

  - name: 'Theming Popovers'
    slug: 'theming-popovers'
    domain: 'theming'
    description: 'Apply glassmorphism themes without breaking CSS stacking'
    type: 'core'
    covers: ['classNames', 'backdrop-filter']
    tasks: ['Apply LIQUID_GLASS_THEME']
    failure_modes:
      - mistake: 'Nested backdrop filters'
        mechanism: 'Applying backdrop-blur directly to the container breaks blur on child popovers due to browser bugs.'
        wrong_pattern: |
          container: 'backdrop-blur-xl bg-white/10'
        correct_pattern: |
          container: 'relative isolate before:absolute before:inset-0 before:backdrop-blur-xl before:-z-10'
        source: 'maintainer interview'
        priority: 'HIGH'
        status: 'active'
        version_context: 'Always applies'
        skills: ['theming-popovers']
