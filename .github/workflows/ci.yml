name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests + typecheck (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  perf:
    name: Real-browser speed benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's ubuntu image is not NixOS, so the bundled Playwright Chromium
      # works here once its system libraries are installed. (On NixOS the bundle
      # can't resolve its shared libs and vitest.browser.config.ts falls back to
      # the system `chromium`; `which chromium` finds nothing on this image, so
      # the config uses the bundled browser installed below.)
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # On a cache hit the browser binary is already present, so only the system
      # libraries need installing; otherwise download the browser too.
      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:perf
